# Weekly review results. The status page and the pinned status issue read this file.
#
# After each weekly review or demo the mentor records the result here (or asks Claude to):
#   decision = "pending" | "passed" | "partly" | "failed"
#   date     = "2026-11-25"                    (the day of the review; empty while not reviewed)
#   status   = "pending" | "met" | "not_met"   (for every criterion)
#   note_fa / note_en = a short note for the students (optional)
# The criteria are copied from docs/plan.md (section 6) and the week pages in docs/handoffs/.
# Edit this file with a normal commit; the page updates by itself right after the push.

