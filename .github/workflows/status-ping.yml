name: status-ping

# A review does not trigger the status workflow by itself, so this tiny workflow asks it to rebuild right away.
# It only asks; the rebuild runs the code on main. (Without it the page still updates within the hour.)

on:
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  actions: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask the status workflow to rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run status.yml --ref main --repo "$GITHUB_REPOSITORY" || echo "could not start it (a pull request from a fork has a read-only token)"
